[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spacelinkops"
version = "4.0.0"
description = "Civilian satellite C3 and TT&C performance and resilience simulator"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ipek Karaman"}]
dependencies = ["numpy>=2.0", "pydantic>=2.7", "PyYAML>=6.0", "sgp4>=2.24"]

[project.optional-dependencies]
dashboard = ["pandas>=2.2", "plotly>=5.22", "streamlit>=1.49"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100"]

[project.scripts]
spacelinkops = "spacelinkops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spacelinkops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
